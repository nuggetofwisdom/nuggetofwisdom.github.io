<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign up for a WDD 131 event ticket as a student or guest.">
  <meta name="author" content="Jacob Mumford">
  <title>Event Ticket | WDD 131</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="card">
    <h1>Event Ticket</h1>

    <form id="eventForm">
      <div class="field">
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" name="firstName" required minlength="1" maxlength="30" autocomplete="given-name">
      </div>

      <div class="field">
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" name="lastName" required minlength="1" maxlength="30" autocomplete="family-name">
      </div>

      <div class="field full">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required maxlength="100" autocomplete="email">
      </div>

      <div class="field">
        <label for="ticketType">Type</label>
        <select id="ticketType" name="ticketType" required>
          <option value="" selected disabled>Choose one</option>
          <option value="student">Student</option>
          <option value="guest">Guest</option>
        </select>
      </div>

      <div class="field">
        <label for="eventDate">Event Date</label>
        <input type="date" id="eventDate" name="eventDate" required>
      </div>

      <!-- Hidden until a type is chosen; label changes to Student I# or Access Code -->
      <div id="codeArea" class="field full hide">
        <label for="code" id="codeLabel">Student I#</label>
        <input type="text" id="code" name="code" maxlength="9" autocomplete="off">
      </div>

      <button type="submit">Create Ticket</button>
    </form>

    <!-- Errors and ticket info show up below the form -->
    <div id="errors" class="errors" aria-live="polite"></div>
    <div id="ticket" aria-live="polite"></div>
  </main>
</body>
</html>
