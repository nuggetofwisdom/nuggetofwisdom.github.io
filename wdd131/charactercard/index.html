<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Card | WDD 131</title>
  <meta name="description" content="An interactive Gumball Watterson character card built with a JavaScript object. Attack him or level him up.">
  <meta name="author" content="Jacob Mumford">

  <!-- Open Graph (Facebook, LinkedIn, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Character Card | WDD 131">
  <meta property="og:description" content="An interactive Gumball Watterson character card built with a JavaScript object. Attack him or level him up.">
  <meta property="og:url" content="https://nuggetofwisdom.github.io/wdd131/charactercard/">
  <meta property="og:image" content="https://nuggetofwisdom.github.io/wdd131/charactercard/images/social-preview.jpg">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Character Card | WDD 131">
  <meta name="twitter:description" content="An interactive Gumball Watterson character card built with a JavaScript object. Attack him or level him up.">
  <meta name="twitter:image" content="https://nuggetofwisdom.github.io/wdd131/charactercard/images/social-preview.jpg">

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico">
  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1 class="visually-hidden">Character Card</h1>
    <section class="card">
      <img class="image" id="char-image" src="images/gumball.webp" alt="" width="400" height="400">
      <h2 class="name" id="char-name"></h2>
      <div class="stats">
        <p><strong>Class:</strong> <span id="char-class"></span></p>
        <p><strong>Level:</strong> <span id="char-level"></span></p>
        <p><strong>Health:</strong> <span id="char-health"></span></p>
      </div>
      <div class="buttons">
        <button type="button" id="attackBtn">Attacked</button>
        <button type="button" id="levelBtn">Level Up</button>
      </div>
      <p class="log" id="log" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
