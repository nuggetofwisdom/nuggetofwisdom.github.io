<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecipeBook | Find a Recipe</title>
    <meta name="description" content="RecipeBook: browse and search simple, delicious recipes like our warm apple crisp.">
    <meta name="author" content="Jacob Mumford">
  
    <meta property="og:type" content="website">
    <meta property="og:title" content="RecipeBook">
    <meta property="og:description" content="Browse and search simple, delicious recipes like our warm apple crisp.">
    <meta property="og:url" content="https://nuggetofwisdom.github.io/wdd131/recipes/">
    <meta property="og:image" content="https://nuggetofwisdom.github.io/wdd131/recipes/images/social-preview-image.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="RecipeBook">
    <meta name="twitter:description" content="Browse and search simple, delicious recipes like our warm apple crisp.">
    <meta name="twitter:image" content="https://nuggetofwisdom.github.io/wdd131/recipes/images/social-preview-image.png">

    <link rel="icon" href="images/favicon.ico">

    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/recipes.css">
</head>
<body>
    <header>
        <a class="logo" href="index.html">
            <img src="images/recipe-book.png" alt="" width="100" height="100">
            <span class="logo-text">RecipeBook</span>
        </a>
        <form class="search" action="#" role="search">
            <label for="search-input" class="visually-hidden">Find a recipe</label>
            <input type="search" id="search-input" name="q" placeholder="Find a recipe">
            <button type="submit" aria-label="Search recipes">
                <img src="images/search.svg" alt="" width="30" height="30">
            </button>
        </form>
    </header>

    <main>
        <h1 class="visually-hidden">Recipes</h1>
        <article class="recipe">
            <img class="recipe-image" src="images/apple-crisp.jpg" alt="Bowl of apple crisp topped with a scoop of vanilla ice cream" width="750" height="563">
            <div class="recipe-info">
                <ul class="tags">
                    <li class="tag">dessert</li>
                </ul>
                <h2>Apple Crisp</h2>
                <span
                  class="rating"
                  role="img"
                  aria-label="Rating: 4 out of 5 stars"
                >
                  <span aria-hidden="true" class="icon-star">⭐</span>
                  <span aria-hidden="true" class="icon-star">⭐</span>
                  <span aria-hidden="true" class="icon-star">⭐</span>
                  <span aria-hidden="true" class="icon-star">⭐</span>
                  <span aria-hidden="true" class="icon-star-empty">☆</span>
                </span>
                <p class="description">This apple crisp recipe is a simple yet delicious fall dessert that's great served warm with vanilla ice cream.</p>
            </div>
        </article>
    </main>

    <footer>
        <a class="attribution" href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>
        <div class="social">
            <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon" width="32" height="32"></a>
            <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon" width="32" height="32"></a>
            <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon" width="32" height="32"></a>
        </div>
    </footer>
</body>
</html>
