<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Search a collection of tasty, easy recipes by name, description, or tag.">
  <meta name="author" content="Jacob Mumford">
  <title>Recipe Book</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Mooli&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="recipes.css">
  <script src="recipes.js" type="module" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="site-logo" href="index.html">
      <img src="images/recipe-book.png" alt="Recipe book logo" width="60" height="60">
      <span class="site-title">Recipes</span>
    </a>
  </header>

  <main>
    <form class="search-form" role="search">
      <label class="visually-hidden" for="search-input">Search recipes</label>
      <input class="search-input" id="search-input" type="search" name="search" placeholder="Search..." autocomplete="off">
      <button class="search-button" type="submit" aria-label="Search">
        <img src="images/search.svg" alt="" width="24" height="24">
      </button>
    </form>

    <section class="recipe-list" id="recipe-list" aria-live="polite">
      <!-- Recipes are rendered here by recipes.js -->
    </section>
  </main>

  <footer class="site-footer">
    <ul class="social-links">
      <li>
        <a href="https://www.instagram.com" target="_blank" rel="noopener">
          <img src="images/instagram_icon.svg" alt="Instagram" width="30" height="30">
        </a>
      </li>
      <li>
        <a href="https://www.pinterest.com" target="_blank" rel="noopener">
          <img src="images/pinterest_icon.svg" alt="Pinterest" width="30" height="30">
        </a>
      </li>
      <li>
        <a href="https://www.youtube.com" target="_blank" rel="noopener">
          <img src="images/youtube_icon.svg" alt="YouTube" width="30" height="30">
        </a>
      </li>
    </ul>
    <p class="copyright">&copy; <span id="current-year"></span> Recipe Book</p>
  </footer>
</body>
</html>
