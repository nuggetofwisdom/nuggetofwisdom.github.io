<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ponder - Objects | WDD 131</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    label, input, button { font-size: 1rem; margin-right: .5rem; }
    input { width: 4rem; }
    table { border-collapse: collapse; margin-top: 1.5rem; width: 100%; }
    th, td { border: 1px solid #999; padding: 5px 10px; text-align: left; }
    th { background: #eee; }
  </style>
  <script src="objects.js" defer></script>
</head>
<body>
  <h1 id="courseName"></h1>
  <h2 id="courseCode"></h2>

  <label for="sectionNumber">Section Number</label>
  <input id="sectionNumber" type="number" min="1">
  <button id="enrollStudent">Enroll Student</button>

  <table>
    <thead>
      <tr>
        <th>Section#</th>
        <th>Room#</th>
        <th>#Enrolled</th>
        <th>Days</th>
        <th>Instructor</th>
      </tr>
    </thead>
    <tbody id="sections"></tbody>
  </table>
</body>
</html>
